[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "deepsort-rs"
version = "0.1.0"
description = "DeepSORT tracker implemented in Rust with Python bindings"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.maturin]
module-name = "deepsort_rs._deepsort_rs"
python-source = "python"
features = ["pyo3/extension-module"]
