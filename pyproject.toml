[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "deepsort-rs"
version = "0.1.0"
description = "DeepSORT tracker implemented in Rust with Python bindings"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0", "scipy>=1.10", "deep-sort-realtime>=1.3.2"]

[tool.maturin]
module-name = "deepsort_rs._deepsort_rs"
python-source = "python"
features = ["pyo3/extension-module"]
